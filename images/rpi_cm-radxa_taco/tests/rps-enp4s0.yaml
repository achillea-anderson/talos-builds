# Receive Packet Steering (RPS) for the TACO's 2.5 GbE NIC, recommended on the CM4
# TACO (kernels/rpi_cm-radxa_taco/README.md, "Node settings"). A machine-config patch, not a
# Kubernetes manifest.
#
# Why: on the CM4 every PCIe interrupt is taken on CPU0, and receive processing (softirq)
# runs on the CPU that took the interrupt, so CPU0 does all of it and saturates under load.
# RPS hands each received packet to another CPU in software, chosen by a hash of its flow.
# "e" is a CPU bitmask (binary 1110): CPUs 1-3, leaving CPU0 to the interrupts themselves.
#
# SysfsConfig is the Talos 1.14 document for /sys values (the older machine.sysfs field
# is deprecated); keys are the path under /sys with dots for slashes. It applies live,
# no reboot:
#
#   talosctl --context cm4-test patch machineconfig --patch @tests/rps-enp4s0.yaml
#   talosctl --context cm4-test read /sys/class/net/enp4s0/queues/rx-0/rps_cpus   # e
#
# To remove it again, patch with the same two header lines plus `$patch: delete`.
apiVersion: v1alpha1
kind: SysfsConfig
params:
  class.net.enp4s0.queues.rx-0.rps_cpus: "e"
